[functions.enviar-factura-nomina]
enabled = true
# Valida el JWT actual y el rol dentro de la función.
verify_jwt = false
entrypoint = "./functions/enviar-factura-nomina/index.ts"

[functions.informes-plan-comercial]
enabled = true
# Acepta cron con secreto y usuarios con JWT; ambos se validan en la función.
verify_jwt = false
import_map = "./functions/informes-plan-comercial/deno.json"
entrypoint = "./functions/informes-plan-comercial/index.ts"

[functions.notificar-objetivos]
enabled = true
# Endpoint exclusivo de cron, protegido por CRON_SECRET dentro de la función.
verify_jwt = false
import_map = "./functions/notificar-objetivos/deno.json"
entrypoint = "./functions/notificar-objetivos/index.ts"

[functions.notificar-cierre-produccion]
