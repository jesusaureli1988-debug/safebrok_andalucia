
[functions.enviar-tpv-recibo]
enabled = true
# Valida el JWT actual con auth.getUser() dentro de la función.
verify_jwt = false
import_map = "./functions/enviar-tpv-recibo/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/enviar-tpv-recibo/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/enviar-tpv-recibo/*.html" ]

