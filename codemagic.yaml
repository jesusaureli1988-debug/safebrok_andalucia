workflows:
  ios-release:
    name: iOS Release SafeBrok
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: "Codemagic Safebrok"

    environment:
      flutter: 3.41.9
      xcode: latest
      cocoapods: default
      vars:
        APP_STORE_APPLE_ID: "6787038104"
        # App Store Connect ID de la ficha existente de SafeBrok.
        APP_STORE_CONNECT_ALTOOL_ADDITIONAL_ARGUMENTS: "--apple-id '6787038104'"
      ios_signing:
        provisioning_profiles:
          - safebrok_appstore_push
        certificates:
          - safebrok_distribution

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Validate Dart code
        script: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Test release regressions and App Review roles
        script: flutter test

      - name: Install pods
        script: |
          cd ios
          pod install
          cd ..

      - name: Set up code signing
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build IPA
        script: |
          set -euo pipefail
          APP_VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r')
          BASE_BUILD=${APP_VERSION##*+}
          LATEST_BUILD=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID")
          if ! [[ "$BASE_BUILD" =~ ^[0-9]+$ && "$LATEST_BUILD" =~ ^[0-9]+$ ]]; then
            echo "No se pudo validar el numero de compilacion de Apple."
            exit 1
          fi
          NEXT_BUILD=$((LATEST_BUILD + 1))
          if (( NEXT_BUILD < BASE_BUILD )); then NEXT_BUILD=$BASE_BUILD; fi
          echo "Compilando SafeBrok ${APP_VERSION%%+*} ($NEXT_BUILD)"
          flutter build ipa --release \
            -t lib/main.dart \
            --build-name="${APP_VERSION%%+*}" \
            --build-number="$NEXT_BUILD" \
            --export-options-plist=/Users/builder/export_options.plist
          echo "BUSCANDO IPA..."
          find build -name "*.ipa" -print

      - name: Verify package_info_plus privacy manifest in IPA
        script: |
          set -e
          python3 -m unittest discover -s tools -p test_ios_privacy_manifest.py
          python3 tools/check_ios_privacy_manifest.py

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
